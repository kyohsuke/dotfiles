
[tools]
awscli = { version = "latest", symlink_bins = "true" }
deno = "latest"
difftastic = "latest"
direnv = "latest"
gh = "latest"
ghq = "latest"
go = "1"
node = "26"
perl = "latest"
python = "3"
ruby = "latest"
usage = { version = "latest", workflow = "publish-cli.yml" }
uv = "latest"


[settings]
cache_prune_age = '7d'
env_shell_expand = true
idiomatic_version_file_enable_tools = ["node"]

# golang
go_set_gobin = false

# ruby
ruby.compile = true
ruby.default_packages_file = "$HOME/.config/anyenv/default-gems"

# node
node.default_packages_file = "$HOME/.config/anyenv/default-packages"

# python
python.compile = true
